name: KeyFlow build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Restore project from single file
        run: python3 keyflow_restore_fix3.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -eo pipefail
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort | tail -1)"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Static QA
        working-directory: KeyFlow
        run: python3 tools/qa_static_check.py
      - name: Build, unit tests, lint, generate locks and schema
        working-directory: KeyFlow
        run: bash tools/ci_prepare_metadata.sh
      - name: Print lint errors
        if: always()
        working-directory: KeyFlow
        run: |
          f=app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if [ -f "$f" ]; then grep -E "^.*: Error: " "$f" | cut -c1-400 || true; else echo "no lint report"; fi
      - name: Verify generated metadata
        working-directory: KeyFlow
        run: python3 tools/verify_reproducibility_metadata.py --require-complete
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keyflow-results
          path: |
            KeyFlow/app/gradle.lockfile
            KeyFlow/app/schemas
            KeyFlow/app/build/outputs/apk/debug/*.apk
            KeyFlow/app/build/reports
            KeyFlow/app/build/test-results
          if-no-files-found: warn
