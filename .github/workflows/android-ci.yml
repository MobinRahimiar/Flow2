
name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PROJECT_DIR: KeyFlow
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate project from create_keyflow.py
        run: |
          python3 create_keyflow.py .
          test -f "$PROJECT_DIR/gradlew"
          ls "$PROJECT_DIR"

      - name: Source-level QA
        run: |
          cd "$PROJECT_DIR"
          python3 tools/qa_static_check.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          build-root-directory: ${{ env.PROJECT_DIR }}

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKM="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort | tail -1)"
          test -n "$SDKM"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" 'platforms;android-35' 'build-tools;35.0.0'

      # Generates Gradle dependency locks and Room schema before running the full build.
      - name: Generate or verify dependency locks, unit tests, lint and debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: bash tools/ci_prepare_metadata.sh

      - name: Run instrumented tests on API 35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: ${{ env.PROJECT_DIR }}
          script: bash tools/ci_instrumented.sh

      - name: Verify generated reproducibility metadata
        if: success()
        working-directory: ${{ env.PROJECT_DIR }}
        run: python3 tools/verify_reproducibility_metadata.py --require-complete

      - name: Verify committed metadata has no drift
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          if git -C "$PROJECT_DIR" ls-files --error-unmatch app/gradle.lockfile >/dev/null 2>&1 \
             && git -C "$PROJECT_DIR" ls-files 'app/schemas/*/1.json' | grep -q .; then
            git -C "$PROJECT_DIR" diff --exit-code -- app/gradle.lockfile app/schemas
          else
            echo '::notice::Generated KeyFlow metadata is not tracked in this generator repository; it will be published as a workflow artifact.'
          fi

      - name: Rename debug APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="$PROJECT_DIR/app/build/outputs/apk/debug"
          VERSION="$(grep -oP 'versionName = "\K[^" ]+' "$PROJECT_DIR/app/build.gradle.kts" | head -1)"
          test -n "$VERSION"
          shopt -s nullglob
          APKS=("$APK_DIR"/*.apk)
          test "${#APKS[@]}" -gt 0
          mv "${APKS[0]}" "$APK_DIR/KeyFlow-${VERSION}-debug.apk"

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: keyflow-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK to the latest release
        if: success() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest "$APK" \
            --title "KeyFlow latest build" \
            --notes "Automatic debug build from commit ${GITHUB_SHA::7}" \
            --prerelease --target "$GITHUB_SHA"

      - name: Upload reports and reproducibility metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keyflow-reports-and-metadata
          path: |
            ${{ env.PROJECT_DIR }}/app/gradle.lockfile
            ${{ env.PROJECT_DIR }}/app/schemas/**/1.json
            ${{ env.PROJECT_DIR }}/app/build/reports/**
            ${{ env.PROJECT_DIR }}/app/build/test-results/**
          if-no-files-found: ignore
