
name: Android CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_DIR: KeyFlow
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  ANDROID_I_WANT_MY_TCG: "yes"

jobs:
  build:
    name: Build and Test Android
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      # 1. دریافت سورس پروژه
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. ساخت فایل‌های پروژه KeyFlow
      - name: Generate KeyFlow project
        shell: bash
        run: |
          set -euo pipefail
          python3 create_keyflow.py .
          test -f "$PROJECT_DIR/gradlew"
          ls "$PROJECT_DIR"

      # 3. بررسی‌های ایستای پروژه
      - name: Run static QA
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          python3 tools/qa_static_check.py

      # 4. نصب Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # 5. تنظیم کش Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 6. بررسی Gradle Wrapper
      - name: Verify Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --version

      # 7. کامپایل برنامه
      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon assembleDebug

      # 8. اجرای تست‌های واحد
      - name: Run Unit Tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon testDebugUnitTest

      # 9. بررسی Lint
      - name: Run Android Lint
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon lintDebug

      # 10. اجرای تست‌های دستگاه واقعی/شبیه‌ساز
      - name: Run Instrumented Tests on Emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          cores: 2
          avd-name: test
          force-avd-creation: true
          emulator-boot-timeout: 600
          emulator-port: 5554
          disable-animations: true
          disable-linux-hw-accel: true
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -no-snapshot
            -noaudio
            -no-boot-anim
          working-directory: KeyFlow
          script: |
            set -euo pipefail

            echo "Checking Android Debug Bridge..."
            adb start-server
            adb devices -l

            echo "Waiting for Android boot..."
            adb wait-for-device

            for attempt in $(seq 1 120); do
              BOOT_COMPLETED="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"

              if [ "$BOOT_COMPLETED" = "1" ]; then
                echo "Android emulator boot completed."
                break
              fi

              echo "Waiting for Android boot: ${attempt}/120"
              sleep 5
            done

            BOOT_COMPLETED="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"

            if [ "$BOOT_COMPLETED" != "1" ]; then
              echo "::error::Android emulator failed to finish booting."
              adb devices -l || true
              exit 1
            fi

            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0

            echo "Running instrumented tests..."
            bash tools/ci_instrumented.sh

      # 11. ذخیره گزارش‌ها و خروجی‌ها حتی در صورت خطا
      - name: Upload reports and metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keyflow-reports-and-metadata
          path: |
            KeyFlow/app/gradle.lockfile
            KeyFlow/app/schemas/**/1.json
            KeyFlow/app/build/reports/**
            KeyFlow/app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 14

      # 12. ذخیره APK خروجی
      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: keyflow-debug-apk
          path: KeyFlow/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
