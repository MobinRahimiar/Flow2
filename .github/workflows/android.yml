name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PROJECT_DIR: KeyFlow
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate project from create_keyflow.py
        shell: bash
        run: |
          GEN="$(find . -maxdepth 3 -iname 'create_keyflow*.py' -not -path './.git/*' | head -1)"
          if [ -z "$GEN" ]; then
            echo "::error::create_keyflow.py was not found in the repository. Files present:"
            find . -maxdepth 3 -not -path './.git/*' | sort
            exit 1
          fi
          echo "Using generator: $GEN"
          python3 "$GEN" .
          ls "$PROJECT_DIR"

      - name: Read version
        id: ver
        run: |
          VERSION="$(grep -oP 'versionName = "\K[^"]+' "$PROJECT_DIR/app/build.gradle.kts")"
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Source-level QA
        run: cd "$PROJECT_DIR" && python3 tools/qa_static_check.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -eo pipefail
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort | tail -1)"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Unit tests, lint and debug APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Name the APK
        run: |
          cd "$PROJECT_DIR/app/build/outputs/apk/debug"
          mv ./*.apk "KeyFlow-${{ steps.ver.outputs.name }}-${GITHUB_SHA::7}-debug.apk"
          ls -l

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: keyflow-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish release for this version
        if: success() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.ver.outputs.name }}"
          APK="$(ls $PROJECT_DIR/app/build/outputs/apk/debug/*.apk | head -1)"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" "$APK" \
            --title "KeyFlow ${{ steps.ver.outputs.name }}" \
            --notes "Automatic debug build from commit ${GITHUB_SHA::7}" \
            --prerelease --target "$GITHUB_SHA"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keyflow-reports
          path: |
            ${{ env.PROJECT_DIR }}/app/build/reports/**
            ${{ env.PROJECT_DIR }}/app/build/test-results/**
          if-no-files-found: ignore
